<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Offer Track: a free, private job search tracker with a dashboard, kanban board, lead queue, AI-tailored resumes and cover letters, and PDF export. Your data stays in your browser.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>








<title>Offer Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15202B; --muted:#5A6776; --faint:#8B97A5; --line:#D7DDE4;
  --accent:#2D4FC4; --accent-ink:#FFFFFF; --accent-soft:#E2E8FA;
  --amber:#A85F08; --amber-soft:#FBEED7; --good:#1C7248; --good-soft:#DCF1E4; --bad:#B3261E; --bad-soft:#F9E0DE; --teal:#0E7383; --teal-soft:#DAF0F2;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 14px rgba(21,32,43,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E131A; --surface:#161D26; --surface-2:#1B2430; --ink:#E4EAF1; --muted:#98A5B4; --faint:#6B7888; --line:#2A3542;
  --accent:#8AA3F4; --accent-ink:#0E131A; --accent-soft:#1E2946;
  --amber:#E8A850; --amber-soft:#3A2A12; --good:#63C491; --good-soft:#14301F; --bad:#F2918A; --bad-soft:#3B1B19; --teal:#5CC3D1; --teal-soft:#123138;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E131A; --surface:#161D26; --surface-2:#1B2430; --ink:#E4EAF1; --muted:#98A5B4; --faint:#6B7888; --line:#2A3542;
  --accent:#8AA3F4; --accent-ink:#0E131A; --accent-soft:#1E2946;
  --amber:#E8A850; --amber-soft:#3A2A12; --good:#63C491; --good-soft:#14301F; --bad:#F2918A; --bad-soft:#3B1B19; --teal:#5CC3D1; --teal-soft:#123138;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:minmax(0,1fr);height:100%;}
@media (min-width:1180px){.shell.chat-docked{grid-template-columns:minmax(0,1fr) 380px}}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;margin-right:8px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{display:block}
.brand b{font-family:var(--display);font-weight:750;font-size:18px;letter-spacing:-.01em}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:7px 12px;border-radius:7px;color:var(--muted);font-weight:500;cursor:pointer}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .spark{width:14px;height:14px}
.content{flex:1;overflow:auto;padding-block:22px 40px;padding-inline:20px}
.banner{margin:0 0 16px;padding:10px 14px;border-radius:8px;background:var(--amber-soft);color:var(--amber);font-weight:500}

/* dashboard */
.dash-head{display:flex;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.dash-head h1{font-size:30px;font-weight:750;letter-spacing:-.02em}
.dash-head p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .value{font-family:var(--display);font-size:30px;font-weight:650;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--faint);margin-top:2px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:16px;font-weight:650;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h2 .count{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover .row-title{color:var(--accent)}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:8px 0;font-size:13px}
.funnel{display:flex;flex-direction:column;gap:8px}
.fbar{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.fbar .track{height:18px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fbar .fill{height:100%;border-radius:4px}
.fbar .n{text-align:right;font-family:var(--mono)}
.chart svg{width:100%;height:auto;display:block}
.feed .row{grid-template-columns:auto minmax(0,1fr) auto}
.ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.ico svg{width:15px;height:15px}
.onboard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.onboard ol{margin:8px 0 0;padding-left:20px;color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-target{background:var(--surface-2);color:var(--muted)}
.st-applied{background:var(--accent-soft);color:var(--accent)}
.st-screen{background:var(--teal-soft);color:var(--teal)}
.st-interview{background:var(--amber-soft);color:var(--amber)}
.st-offer{background:var(--good-soft);color:var(--good)}
.st-closed{background:var(--surface-2);color:var(--faint)}
.due-over{background:var(--bad-soft);color:var(--bad)}
.due-today{background:var(--amber-soft);color:var(--amber)}
.due-soon{background:var(--surface-2);color:var(--muted)}

/* board */
.board-wrap{overflow-x:auto;margin-inline:-20px;padding-inline:20px;padding-bottom:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;min-height:420px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.col-head{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:46px}
.col-head h3{font-size:14px;font-weight:650}
.col-head .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.col-bar{height:3px;border-radius:2px;margin:0 12px 8px}
.col-body{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer;box-shadow:var(--shadow)}
.card:hover{border-color:var(--faint)}
.card.dragging{opacity:.4}
.card .co{font-weight:600;display:flex;align-items:center;gap:6px}
.card .role{font-size:13px;color:var(--ink);margin-top:1px}
.card .meta{font-size:12px;color:var(--muted);margin-top:2px}
.card .foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.prio.high{background:var(--bad)} .prio.med{background:var(--amber)} .prio.low{background:var(--faint)}
.tick{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--faint)}
.tick.on{border-color:transparent;background:var(--good-soft);color:var(--good)}
.col-empty{font-size:12px;color:var(--faint);text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:8px}

/* leads */
.nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--amber-soft);color:var(--amber);font-size:11px;font-weight:700;font-family:var(--mono);line-height:18px;text-align:center}
.nav .badge:empty{display:none}
.scanbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.scanbar .status{flex:1;min-width:200px}
.leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lead-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.score{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:650;font-size:19px;font-variant-numeric:tabular-nums}
.score.hi{background:var(--good-soft);color:var(--good)} .score.mid{background:var(--accent-soft);color:var(--accent)} .score.lo{background:var(--surface-2);color:var(--muted)}
.lead h3{font-size:17px;font-weight:650}
.lead .lrole{color:var(--muted);font-size:13px}
.lead p{margin:0;font-size:13px}
.lead .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;display:block;margin-bottom:1px}
.lead-foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.sig-funding{background:var(--good-soft);color:var(--good)} .sig-leader{background:var(--amber-soft);color:var(--amber)} .sig-program{background:var(--teal-soft);color:var(--teal)} .sig-posting{background:var(--accent-soft);color:var(--accent)} .sig-email{background:var(--surface-2);color:var(--muted)} .sig-chat{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button svg{width:14px;height:14px;vertical-align:-2px}
.lead-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.lead-table table{min-width:860px}
.lead-table td{vertical-align:top}
.lead-table .sc{display:inline-grid;place-items:center;width:34px;height:28px;border-radius:7px;font-family:var(--display);font-weight:650;font-variant-numeric:tabular-nums}
.lead-table .sc.hi{background:var(--good-soft);color:var(--good)} .lead-table .sc.mid{background:var(--accent-soft);color:var(--accent)} .lead-table .sc.lo{background:var(--surface-2);color:var(--muted)}
.lead-table .co{font-weight:600}
.lead-table .sub{font-size:12.5px;color:var(--muted)}
.lead-table .sig{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:420px}
.lead-table tr.open .sig{-webkit-line-clamp:unset;display:block}
.lead-table .more{font-size:12.5px;color:var(--muted);margin-top:6px;max-width:420px}
.lead-table .more b{color:var(--ink);font-weight:600}
.lead-table .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;min-width:200px}

/* scan task strip */
.taskstrip{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.taskstrip .ico{background:var(--accent-soft);color:var(--accent)}
.taskstrip .tinfo{flex:1;min-width:220px}
.taskstrip .tname{font-weight:600}
.taskstrip .tmeta{font-size:12.5px;color:var(--muted)}
.taskstrip .tmeta b{font-weight:600}
.run-ok{color:var(--good)} .run-wait{color:var(--amber)} .run-bad{color:var(--bad)}
.taskstrip form{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.taskstrip form .input{flex:1;min-width:200px}

/* playbook */
.pb{display:flex;flex-direction:column;gap:0}
.pb-step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pb-step:first-child{border-top:0;padding-top:2px}
.pb-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--faint);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;margin-top:1px}
.pb-check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.pb-check svg{width:13px;height:13px}
.pb-title{font-weight:600}
.pb-why{font-size:13px;color:var(--muted);margin:2px 0 6px}
.pb-meta{font-size:12px;color:var(--faint);font-family:var(--mono)}
.pb-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.pb-intro{font-size:13px;color:var(--muted);margin:-4px 0 8px}

/* resume drop */
.dropzone{border:1.5px dashed var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dropzone.over,.doc-editor.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .dz-ico{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.dropzone .dz-ico svg{width:18px;height:18px}
.dropzone .dz-text{flex:1;min-width:200px}
.dropzone .dz-text b{font-weight:600}
.dropzone label.btn{cursor:pointer}
.dropzone input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upload-panel{border:1px solid var(--accent);border-radius:10px;background:var(--surface);padding:14px 16px;margin-bottom:10px}
.upload-panel h3{font-size:15px;font-weight:650;margin-bottom:4px}
.upload-panel textarea{min-height:180px;font-size:13px;margin:8px 0}

/* profile switcher */
.prof-sel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.prof-sel select{width:auto;max-width:220px;padding:6px 8px;font-weight:500;color:var(--ink)}

/* list */
.list-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea.input{resize:vertical;line-height:1.55}
.list-tools .input{max-width:280px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}

/* job */
.job-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.job-title{flex:1;min-width:220px}
.job-title .eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.job-title h1{font-size:28px;font-weight:750;letter-spacing:-.02em;margin-top:2px}
.job-title .role{font-size:16px;color:var(--muted);margin-top:2px}
.job-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepper{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:92px;border:0;background:var(--surface);border:1px solid var(--line);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.step small{display:block;font-size:11px;color:var(--faint);font-family:var(--mono)}
.step b{font-weight:600;font-size:13px}
.step.done{background:var(--surface-2);color:var(--muted)}
.step.current{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.current small{color:var(--accent-ink);opacity:.8}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field.full{grid-column:1/-1}
.doc-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.doc-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.doc-grid{grid-template-columns:minmax(0,1fr) 290px}}
.doc-editor{min-height:520px;font-family:var(--body);font-size:14px;background:var(--surface);padding:16px 18px}
.side-stack{display:flex;flex-direction:column;gap:12px}
.status{font-size:12px;color:var(--muted)}
.fit-score{display:flex;align-items:baseline;gap:6px}
.fit-score b{font-family:var(--display);font-size:34px;font-weight:650}
.taglist{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.side-stack ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.side-stack h3{font-size:13px;font-weight:650;margin-top:10px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tl-item:first-child{border-top:0}
.tl-head{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.tl-head b{font-weight:600}
.tl-head .when{font-size:12px;color:var(--muted);font-family:var(--mono)}
.tl-body{font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.tl-actions{display:flex;gap:6px;margin-top:4px}
.subpanel{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.gm-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:340px;overflow:auto}

<script>
/* ---------- constants ---------- */
const STAGES=[
  {id:'target',label:'Target',color:'var(--faint)'},
  {id:'applied',label:'Applied',color:'var(--accent)'},
  {id:'screen',label:'Screening',color:'var(--teal)'},
  {id:'interview',label:'Interviewing',color:'var(--amber)'},
  {id:'offer',label:'Offer',color:'var(--good)'},
  {id:'closed',label:'Closed',color:'var(--faint)'}
];
const SIDX=Object.fromEntries(STAGES.map((s,i)=>[s.id,i]));
const SLABEL=Object.fromEntries(STAGES.map(s=>[s.id,s.label]));
const OUTCOMES=['Hired','Rejected','Withdrew','No response','Role closed'];
const DEFAULT_PLAYBOOK=[
  {k:'dm',title:'DM the hiring manager',why:'Find and reach the right person at the company. Finding the decision-maker is the first rep.',ph:'Who you messaged, where (LinkedIn, email), and when',
   ask:'Help me find the most likely hiring manager for this role (title, team, how to identify them on LinkedIn) and draft a short, specific DM to them. Under 300 characters for a LinkedIn connection note, plus a slightly longer InMail/email version. No generic flattery.'},
  {k:'multi',title:'Multithread leadership',why:'Reach several leaders thoughtfully, not spam. Show you can align five people, not one.',ph:'Leaders contacted (name, title, channel, date)',
   ask:'Map 3 to 5 leaders at this company I should thoughtfully multithread (e.g. hiring manager, their boss, the department head, a peer, a recruiter). For each, give the likely title, why they matter, and a distinct short message angle so it reads as coordinated, not spam.'},
  {k:'follow',title:'Show speed and follow-through',why:'How fast and how sharp you follow up sets the standard you will set for a team.',ph:'Follow-ups sent and replies',
   ask:'Draft a sharp follow-up for today based on where this application stands and my communication history: what to say, who to send it to, and when I should follow up next if there is no reply.'}
];
const PB_INTRO_DEFAULT="The moment you apply, you're being evaluated on habits and behaviors. Show them, don't tell them.";
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m3 8.5 3.2 3L13 4.5"/></svg>';
function getPlaybook(){const pb=state.profile.playbook;return Array.isArray(pb)&&pb.length?pb.filter(x=>x&&x.title):DEFAULT_PLAYBOOK}
const pbDone=j=>getPlaybook().filter(s=>j.playbook?.[s.k]?.done).length;
const sinceTxt=ts=>{if(!ts)return '';const h=Math.floor((Date.now()-ts)/36e5);return h<1?'under an hour ago':h<48?h+' hours ago':Math.floor(h/24)+' days ago'};
const DAY=864e5;
const ICONS={
  email:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="3" width="13" height="10" rx="1.5"/><path d="m2 4 6 5 6-5"/></svg>',
  call:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5.5 2h-2A1.5 1.5 0 0 0 2 3.6C2.3 9.4 6.6 13.7 12.4 14a1.5 1.5 0 0 0 1.6-1.5v-2l-3-1.2-1.4 1.4a8 8 0 0 1-3.3-3.3L7.7 6 6.5 2z"/></svg>',
  note:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2h7l3 3v9H3z"/><path d="M5.5 7.5h5M5.5 10.5h5"/></svg>',
  meeting:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg>',
  stage:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h9M9 4.5 12.5 8 9 11.5"/></svg>',
  spark:'<svg class="spark" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8l5.1-1.4z"/></svg>'
};

/* ---------- state ---------- */
const PROFILE_DEFAULT={compCols:3,name:'',headline:'',targets:'',baseResume:'',email:'',phone:'',location:'',linkedin:''};
const state={jobs:{},profile:{...PROFILE_DEFAULT},globalChat:[],view:'dashboard',jobId:null,tab:'overview',
  leads:{},scan:{},leadTab:'new',leadView:(()=>{try{return localStorage.getItem('ot-leadView')||'tiles'}catch(e){return 'tiles'}})(),leadOpen:{},leadSort:(()=>{try{return localStorage.getItem('ot-leadSort')||''}catch(e){return ''}})(),leadScan:null,loaded:false,offline:false,chatOpen:false,filter:'',stageFilter:'',sub:null,gmail:null,callImport:null,confirmDelete:false,gen:null,profiles:{},confirmProfDel:false};
let db=null,sample=null,mcp=null,downloads=null,toolsOK=false;
const deleted=new Set();let chatCtl=null,chatBusy=false,genCtl=null,renderPending=false;

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const parseDate=s=>{if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}const d=new Date(s);return isNaN(d)?null:d};
const startOfDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const daysFromToday=s=>{const d=parseDate(s);if(!d)return null;return Math.round((startOfDay(d)-startOfDay(new Date()))/DAY)};
const fmtDate=s=>{const d=parseDate(s);if(!d)return '';return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined})};
const fmtWhen=ts=>{if(!ts)return '';const d=new Date(ts);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};
const jobList=()=>Object.values(state.jobs).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
const curJob=()=>state.view==='job'?state.jobs[state.jobId]:null;
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');let t=o;ks.slice(0,-1).forEach(k=>{if(typeof t[k]!=='object'||!t[k])t[k]={};t=t[k]});t[ks.at(-1)]=v}
function toast(msg){const r=$('#toast-root');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',3200)}
function lastActivity(j){let t=j.createdAt||0;(j.stageHistory||[]).forEach(h=>t=Math.max(t,h.at||0));(j.comms||[]).forEach(c=>{const d=parseDate(c.date);if(d)t=Math.max(t,d.getTime())});const a=parseDate(j.appliedDate);if(a)t=Math.max(t,a.getTime());return t}
function maxReached(j){let m=j.stage==='closed'?0:SIDX[j.stage]||0;(j.stageHistory||[]).forEach(h=>{if(h.stage!=='closed')m=Math.max(m,SIDX[h.stage]||0)});if(j.appliedDate)m=Math.max(m,1);return m}
function dueChip(j){if(!j.nextAction&&!j.nextDate)return '';const n=daysFromToday(j.nextDate);let cls='due-soon',lbl=j.nextDate?fmtDate(j.nextDate):'No date';if(n!==null){if(n<0){cls='due-over';lbl=(-n)+'d overdue'}else if(n===0){cls='due-today';lbl='Today'}else if(n===1)lbl='Tomorrow'}return `<span class="chip ${cls}" title="${esc(j.nextAction||'')}">${esc(lbl)}</span>`}
function stageChip(s){return `<span class="chip dot st-${s}">${esc(SLABEL[s]||s)}</span>`}
function mdToHtml(src){
  const lines=esc(src).split('\n');let out='',list=null;
  const inline=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  let para=[];const flush=()=>{if(para.length){out+='<p>'+inline(para.join('<br>'))+'</p>';para=[]}};
  for(const raw of lines){const l=raw.trimEnd();
    let m;
    if(!l.trim()){flush();close();continue}
    if((m=l.match(/^#{1,4}\s+(.*)/))){flush();close();out+='<h4>'+inline(m[1])+'</h4>';continue}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){flush();if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>';continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flush();if(list!=='ol'){close();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>';continue}
    close();para.push(l)}
  flush();close();return out}

/* ---------- persistence ---------- */
const timers={},chains={};
let PID=(()=>{try{return localStorage.getItem('ot-profile')||'main'}catch(e){return 'main'}})();
const P=x=>PID==='main'?x:'p/'+PID+'/'+x;
const pending={};
function runWrite(key){const fn=pending[key];delete pending[key];clearTimeout(timers[key]);delete timers[key];if(!db||!fn)return;chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(e=>toast(dbErr(e)))}
function queueWrite(key,fn,delay=500){clearTimeout(timers[key]);pending[key]=fn;timers[key]=setTimeout(()=>runWrite(key),delay)}
function flushWrites(){Object.keys(pending).forEach(runWrite)}
function dbErr(e){const c=e&&e.code;if(c==='quota_exceeded')return 'Storage is full. Delete old jobs to add more.';if(c==='invalid_argument')return 'That change could not be saved (the record may be too large).';if(c==='revoked'||c==='not_granted')return 'Saving is not available in this view.';return 'Could not save just now. Your change will retry with the next edit.'}
function strip(j){const o=clone(j);delete o.id;return o}
function persistJob(id,delay){const path=P('jobs')+'/'+id;queueWrite('job:'+id,()=>{const j=state.jobs[id];return j?db.doc(path).set(strip(j)):db.doc(path).delete()},delay)}
function updateJob(id,patch,delay){const j=state.jobs[id];if(!j)return;for(const[k,v]of Object.entries(patch))setPath(j,k,v);j.updatedAt=Date.now();persistJob(id,delay)}
function persistProfile(){const path=P('settings')+'/profile';queueWrite('profile',()=>db.doc(path).set(clone(state.profile)),700)}
function persistChat(job){if(job){job.chat=(job.chat||[]).slice(-40);persistJob(job.id,50)}else{state.globalChat=state.globalChat.slice(-40);{const path=P('chats')+'/global';queueWrite('chat',()=>db.doc(path).set({messages:clone(state.globalChat)}),50)}}}
function setStage(id,stage){const j=state.jobs[id];if(!j||j.stage===stage)return;const hist=(j.stageHistory||[]).concat([{stage,at:Date.now()}]);const patch={stage,stageHistory:hist};if(stage==='applied'&&!j.appliedDate)patch.appliedDate=todayISO();{const f=getPlaybook()[0];if(stage==='applied'&&f&&!j.playbook?.[f.k]?.done&&(!j.nextAction||/tailor|paste the posting|research/i.test(j.nextAction))){patch.nextAction=f.title;patch.nextDate=todayISO()}}updateJob(id,patch,50)}
function newJob(fields){const id=uid('j');const now=Date.now();const j={company:'',role:'',location:'',salary:'',source:'',url:'',priority:'med',stage:'target',appliedDate:'',nextAction:'',nextDate:'',
  contact:{name:'',title:'',email:'',phone:''},description:'',notes:'',resume:{text:'',updatedAt:0},cover:{text:'',updatedAt:0,tone:'Warm and direct'},comms:[],chat:[],stageHistory:[{stage:fields.stage||'target',at:now}],createdAt:now,updatedAt:now,...fields,id};
  state.jobs[id]=j;persistJob(id,0);return j}

/* ---------- rendering ---------- */
function safeRender(){const a=document.activeElement;if(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){renderPending=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(renderPending){const a=document.activeElement;if(!(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){renderPending=false;render()}}},0));

function render(){
  renderPending=false;
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.view===state.view)));
  {const n=Object.values(state.leads).filter(l=>l.status==='new').length;$('#lead-badge').textContent=n?String(n):''}
  if(!render.sel){render.sel=1;renderProfileSelect()}
  const v=$('#view');const sc=v.scrollTop;
  let html=state.offline?'<p class="banner">This copy can\'t save or reach Claude. Open it from your Claude artifacts to keep changes.</p>':'';
  if(state.standalone&&!apiKey()&&state.view!=='profile')html+='<p class="banner">You\'re running Offer Track in your browser: your data is saved on this device only. To turn on the AI features (tailoring, cover letters, coach, lead scan), <a href="#" data-act="nav" data-view="profile">connect the AI of your choice</a>: Claude, ChatGPT models, Gemini, OpenRouter or a local model.</p>';
  if(!state.loaded&&!state.offline)html+='<p class="empty">Loading your pipeline…</p>';
  else html+=({dashboard:viewDashboard,board:viewBoard,leads:viewLeads,jobs:viewJobs,profile:viewProfile,job:viewJob}[state.view]||viewDashboard)();
  v.innerHTML=html;v.scrollTop=sc;
  if(state.view==='board')wireBoard();
  renderAssistant();
}

/* Dashboard */
function viewDashboard(){
  const jobs=jobList();const active=jobs.filter(j=>j.stage!=='closed');
  const now=Date.now();
  const applied30=jobs.filter(j=>{const d=parseDate(j.appliedDate);return d&&now-d<30*DAY}).length;
  const appliedAll=jobs.filter(j=>maxReached(j)>=1);
  const responded=appliedAll.filter(j=>maxReached(j)>=2||(j.comms||[]).some(c=>c.dir==='in'));
  const rate=appliedAll.length?Math.round(100*responded.length/appliedAll.length):null;
  const interviewing=jobs.filter(j=>j.stage==='interview').length, offers=jobs.filter(j=>j.stage==='offer').length;
  const h=new Date().getHours();const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const first=(state.profile.name||'').split(' ')[0];
  let s=`<div class="dash-head"><div><h1>${greet}${first?', '+esc(first):''}</h1><p>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} · ${active.length} active ${active.length===1?'opportunity':'opportunities'}</p></div><span class="spacer"></span><button class="btn" data-act="ask" data-q="Look at my whole pipeline. What are the three most important things I should do today, and why?">${ICONS.spark} Plan my day</button></div>`;
  s+=taskStrip();
  if(!jobs.length||!state.profile.baseResume)s+=`<div class="onboard"><h2 style="font-size:18px">Get set up</h2><ol>
    ${state.profile.baseResume?'':'<li><a href="#" data-act="nav" data-view="profile">Paste your base resume</a> so Claude can tailor it for each job.</li>'}
    ${jobs.length?'':'<li><a href="#" data-act="add-job">Add your first job target</a>. Paste the posting and Claude fills in the details.</li>'}
    <li>Open a job to tailor a resume, draft a cover letter, and pull related Gmail threads into its history.</li></ol></div>`;
  s+=`<div class="kpis">
    ${kpi('Active pipeline',active.length,'not closed')}
    ${kpi('Applied, 30 days',applied30,appliedAll.length+' applied all-time')}
    ${kpi('Response rate',rate===null?'–':rate+'%',responded.length+' of '+appliedAll.length+' heard back')}
    ${kpi('Interviewing',interviewing,'current')}
    ${kpi('Offers',offers,'current')}</div>`;
  // next actions
  const acts=active.filter(j=>j.nextAction||j.nextDate).sort((a,b)=>(parseDate(a.nextDate)||9e15)-(parseDate(b.nextDate)||9e15)).slice(0,8);
  const stale=active.filter(j=>['applied','screen','interview'].includes(j.stage)&&now-lastActivity(j)>7*DAY&&!(daysFromToday(j.nextDate)>=0)).sort((a,b)=>lastActivity(a)-lastActivity(b)).slice(0,6);
  s+='<div class="panels">';
  s+=`<section class="panel"><h2>Next actions <span class="count">${acts.length}</span></h2><div class="rows">${acts.length?acts.map(j=>`<div class="row" data-act="open" data-id="${j.id}"><div style="min-width:0"><div class="row-title">${esc(j.nextAction||'Set a next step')}</div><div class="row-sub">${esc(j.company)} · ${esc(j.role)}</div></div>${dueChip(j)}</div>`).join(''):'<p class="empty">No next steps scheduled. Open a job and set one.</p>'}</div></section>`;
  s+=`<section class="panel"><h2>Pipeline funnel</h2><div class="funnel">${STAGES.slice(0,5).map((st,i)=>{const n=jobs.filter(j=>maxReached(j)>=i).length;const max=Math.max(1,jobs.length);return `<div class="fbar"><span>${st.label}</span><div class="track"><div class="fill" style="width:${n/max*100}%;background:${st.color}"></div></div><span class="n">${n}</span></div>`}).join('')}</div><p class="hint" style="margin:10px 0 0">Jobs that reached each stage, including closed ones.</p></section>`;
  s+=`<section class="panel"><h2>Needs follow-up <span class="count">${stale.length}</span></h2><div class="rows">${stale.length?stale.map(j=>{const d=Math.floor((now-lastActivity(j))/DAY);return `<div class="row" data-act="open" data-id="${j.id}"><div style="min-width:0"><div class="row-title">${esc(j.company)}</div><div class="row-sub">${esc(j.role)} · ${SLABEL[j.stage]}</div></div><span class="chip due-today">${d}d quiet</span></div>`}).join(''):'<p class="empty">Nothing has gone quiet for more than a week.</p>'}</div></section>`;
  s+=`<section class="panel chart"><h2>Applications per week</h2>${weeklyChart(jobs)}</section>`;
  const fresh=Object.values(state.leads).filter(l=>l.status==='new').sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,4);
  s+=`<section class="panel"><h2>Fresh leads <span class="count">${Object.values(state.leads).filter(l=>l.status==='new').length}</span></h2><div class="rows">${fresh.length?fresh.map(l=>`<div class="row" data-act="nav" data-view="leads"><div style="min-width:0"><div class="row-title">${esc(l.company)} · ${esc(l.role)}</div><div class="row-sub">${esc(l.signal)}</div></div><span class="chip ${l.score>=80?'st-offer':l.score>=65?'st-applied':''}">${esc(l.score)}</span></div>`).join(''):'<p class="empty">No new leads. Run a scan from the Leads page.</p>'}</div></section>`;
  // activity feed
  const ev=[];jobs.forEach(j=>{(j.comms||[]).forEach(c=>ev.push({t:parseDate(c.date)?.getTime()||0,type:c.type,title:(c.subject||c.body||'').slice(0,90)||c.type,who:j.company,id:j.id}));(j.stageHistory||[]).slice(1).forEach(h=>ev.push({t:h.at,type:'stage',title:'Moved to '+SLABEL[h.stage],who:j.company,id:j.id}))});
  ev.sort((a,b)=>b.t-a.t);
  s+=`<section class="panel feed" style="grid-column:1/-1"><h2>Recent activity</h2><div class="rows">${ev.length?ev.slice(0,8).map(e=>`<div class="row" data-act="open" data-id="${e.id}"><span class="ico">${ICONS[e.type]||ICONS.note}</span><div style="min-width:0"><div class="row-title">${esc(e.title)}</div><div class="row-sub">${esc(e.who)}</div></div><span class="hint mono">${e.t?fmtDate(new Date(e.t).toISOString()):''}</span></div>`).join(''):'<p class="empty">Emails, calls, notes and stage changes will show up here.</p>'}</div></section>`;
  return s+'</div>';
}
function kpi(l,v,sub){return `<div class="kpi"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="sub">${esc(sub)}</div></div>`}
function weeklyChart(jobs){
  const W=8,now=startOfDay(new Date());const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const buckets=Array.from({length:W},(_,i)=>{const s=new Date(mon);s.setDate(mon.getDate()-7*(W-1-i));return{s,n:0}});
  jobs.forEach(j=>{const d=parseDate(j.appliedDate);if(!d)return;for(let i=W-1;i>=0;i--){if(d>=buckets[i].s){if(i<W-1||d<new Date(buckets[i].s.getTime()+7*DAY))buckets[i].n++;break}}});
  const max=Math.max(4,...buckets.map(b=>b.n));const top=Math.ceil(max/2)*2;
  const w=420,h=170,pl=26,pb=24,pt=10,bw=(w-pl-8)/W;
  let g='';for(let t=0;t<=top;t+=top/2){const y=pt+(h-pt-pb)*(1-t/top);g+=`<line x1="${pl}" x2="${w-4}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" style="fill:var(--faint)" font-family="IBM Plex Mono, monospace">${t}</text>`}
  buckets.forEach((b,i)=>{const bh=(h-pt-pb)*(b.n/top);const x=pl+i*bw+bw*.18;const y=h-pb-bh;const last=i===W-1;
    g+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(bh,0)}" rx="3" style="fill:${last?'var(--accent)':'var(--accent-soft)'}"><title>${b.n} applied week of ${b.s.toLocaleDateString()}</title></rect>`;
    if(b.n)g+=`<text x="${x+bw*.32}" y="${y-4}" text-anchor="middle" font-size="10" style="fill:var(--muted)" font-family="IBM Plex Mono, monospace">${b.n}</text>`;
    if(i%2===1||last)g+=`<text x="${x+bw*.32}" y="${h-8}" text-anchor="middle" font-size="10" style="fill:var(--faint)">${b.s.toLocaleDateString(undefined,{month:'numeric',day:'numeric'})}</text>`});
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Applications per week, last 8 weeks">${g}</svg>`}

/* Board */
function viewBoard(){
  const jobs=jobList();
  return `<div class="dash-head"><div><h1>Board</h1><p>Drag cards between stages. Open a card for resume, cover letter and history.</p></div></div>
  <div class="board-wrap"><div class="board">${STAGES.map(st=>{const col=jobs.filter(j=>j.stage===st.id);
    return `<section class="col" data-stage="${st.id}"><div class="col-head"><h3>${st.label}</h3><span class="count">${col.length}</span><span class="spacer"></span>${st.id==='target'?'<button class="btn ghost small" data-act="add-job">+ Add</button>':''}</div><div class="col-bar" style="background:${st.color}"></div><div class="col-body">${col.length?col.map(card).join(''):'<div class="col-empty">Drop a card here</div>'}</div></section>`}).join('')}</div></div>`}
function card(j){
  const nc=(j.comms||[]).length;
  return `<article class="card" draggable="true" data-act="open" data-id="${j.id}" tabindex="0">
    <div class="co"><span class="prio ${j.priority||'med'}" title="${esc(j.priority||'med')} priority"></span>${esc(j.company||'Untitled company')}</div>
    <div class="role">${esc(j.role||'Role not set')}</div>
    ${j.location?`<div class="meta">${esc(j.location)}</div>`:''}
    ${j.stage==='closed'&&j.outcome?`<div class="meta">${esc(j.outcome)}</div>`:''}
    <div class="foot">${dueChip(j)}<span class="tick ${j.resume?.text?'on':''}">Resume</span><span class="tick ${j.cover?.text?'on':''}">Letter</span>${['applied','screen','interview'].includes(j.stage)?`<span class="tick ${pbDone(j)===getPlaybook().length?'on':''}" title="Beyond-the-application steps">Playbook ${pbDone(j)}/${getPlaybook().length}</span>`:''}${nc?`<span class="tick">${nc} logged</span>`:''}</div></article>`}
function wireBoard(){
  document.querySelectorAll('.card[draggable]').forEach(c=>{
    c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
    c.addEventListener('dragend',()=>c.classList.remove('dragging'))});
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop')});
    col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('drop')});
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drop');const id=e.dataTransfer.getData('text/plain');if(state.jobs[id]){setStage(id,col.dataset.stage);render();toast(`${state.jobs[id].company||'Job'} moved to ${SLABEL[col.dataset.stage]}`)}})});
}

/* Leads */
const SIG={funding:'Funding',leader:'New leader',program:'Partner program',posting:'Open role',email:'Email alert',chat:'From your chats'};
function leadKey(company,role){return (String(company||'').toLowerCase().replace(/[^a-z0-9]/g,'')+'|'+String(role||'').toLowerCase().replace(/[^a-z0-9]/g,''))}
function persistLead(id){const path=P('leads')+'/'+id;queueWrite('lead:'+id,()=>{const l=state.leads[id];const o=clone(l);delete o.id;return db.doc(path).set(o)},50)}
function viewLeads(){
  const all=Object.values(state.leads);const counts={new:0,added:0,dismissed:0};all.forEach(l=>counts[l.status]=(counts[l.status]||0)+1);
  const sortKey=state.leadSort||(state.leadTab==='new'?'fit':'found');
  const sd=l=>parseDate(l.sourceDate)?.getTime()||0;
  const SORTS={fit:(a,b)=>(b.score||0)-(a.score||0)||sd(b)-sd(a),found:(a,b)=>(b.foundAt||0)-(a.foundAt||0)||(b.score||0)-(a.score||0),signal:(a,b)=>sd(b)-sd(a)||(b.score||0)-(a.score||0),
    company:(a,b)=>String(a.company||'').localeCompare(String(b.company||''),undefined,{sensitivity:'base'}),type:(a,b)=>String(SIG[a.signalType]||'').localeCompare(String(SIG[b.signalType]||''))||(b.score||0)-(a.score||0),
    fitlow:(a,b)=>(a.score||0)-(b.score||0)};
  const list=all.filter(l=>l.status===state.leadTab).sort(SORTS[sortKey]||SORTS.fit);
  const sc=state.scan||{};
  const webStatus=state.standalone?(apiKey()?`Scan the web with ${PROVIDERS[prov()].label.split(' (')[0]} to find fresh leads that match your profile.`:'Connect an AI provider on the Profile page to scan the web for leads.'):sc.triggerId?`${sc.scheduleLabel?'Lead scan runs '+sc.scheduleLabel.replace(/^./,c=>c.toLowerCase())+'.':'Lead scan is scheduled.'}${sc.lastRun?' Last run '+fmtWhen(sc.lastRun)+(sc.lastCount!=null?' · '+sc.lastCount+' added':'')+'.':''}`:'Web scan is not scheduled yet.';
  return `<div class="dash-head"><div><h1>Lead queue</h1><p>Hidden-market signals and fresh listings that fit your background. Add the good ones to your board.</p></div></div>
  <div class="scanbar"><div class="status"><div>${esc(webStatus)}</div>${state.leadScan?`<div class="hint">${esc(state.leadScan)}</div>`:''}</div>
    ${mcp?`<button class="btn" data-act="scan-gmail" ${sample&&!state.scanBusy?'':'disabled'}>Scan Gmail alerts</button>`:''}
    <button class="btn primary" data-act="scan-web" ${(state.standalone?apiKey():mcp&&sc.triggerId)&&!state.scanBusy?'':'disabled'}>${ICONS.spark} ${state.standalone?'Scan web for leads':'Scan web + chats now'}</button></div>
  <div class="lead-bar"><div class="seg" role="group" aria-label="Lead status">${[['new','New'],['added','Added'],['dismissed','Dismissed']].map(([k,l])=>`<button aria-pressed="${state.leadTab===k}" data-act="lead-tab" data-tab="${k}">${l} <span class="mono">${counts[k]||0}</span></button>`).join('')}</div><span class="spacer"></span>
    <label class="sub" for="lead-sort" style="font-size:13px;color:var(--muted)">Sort by</label><select class="input" id="lead-sort" data-ui="leadSort" style="width:auto;padding:5px 8px">${[['fit','Best fit'],['fitlow','Lowest fit'],['signal','Newest signal'],['found','Recently added'],['company','Company A–Z'],['type','Signal type']].map(([k,l])=>`<option value="${k}" ${sortKey===k?'selected':''}>${l}</option>`).join('')}</select>
    <div class="seg" role="group" aria-label="Layout"><button aria-pressed="${state.leadView==='tiles'}" data-act="lead-view" data-v="tiles"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg> Tiles</button><button aria-pressed="${state.leadView==='list'}" data-act="lead-view" data-v="list"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="3" width="12" height="2" rx="1"/><rect x="2" y="7" width="12" height="2" rx="1"/><rect x="2" y="11" width="12" height="2" rx="1"/></svg> List</button></div></div>
  ${!list.length?`<p class="empty">${state.leadTab==='new'?'No new leads right now. Run a scan, or check back after the next morning run.':'Nothing here yet.'}</p>`:state.leadView==='list'?leadTable(list,sortKey):`<div class="leads">${list.map(leadCard).join('')}</div>`}`}
function leadActions(l){return l.status==='new'?`<button class="btn small primary" data-act="lead-add" data-id="${l.id}">Add to board</button><button class="btn small" data-act="lead-ask" data-id="${l.id}">${ICONS.spark} Draft outreach</button><button class="btn small ghost" data-act="lead-dismiss" data-id="${l.id}">Dismiss</button>`:

function leadTable(list,sortKey){
  return `<div class="table-wrap lead-table"><table><thead><tr>${[['fit','Fit','width:56px'],['company','Company',''],['type','Signal',''],['signal','Date','']].map(([k,l,st])=>`<th style="${st}"><button class="btn ghost small" style="padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit" data-act="lead-sort" data-k="${k==='fit'&&sortKey==='fit'?'fitlow':k}" aria-label="Sort by ${l}">${l}${sortKey===k||(k==='fit'&&sortKey==='fitlow')?(sortKey==='fitlow'?' ↑':' ↓'):''}</button></th>`).join('')}<th style="text-align:right">Actions</th></tr></thead><tbody>
  ${list.map(l=>{const sc=Number(l.score)||0;const open=!!state.leadOpen[l.id];

        ${open?`${l.whyFit?`<div class="more"><b>Why it fits:</b> ${esc(l.whyFit)}</div>`:''}${l.angle?`<div class="more"><b>Angle:</b> ${esc(l.angle)}</div>`:''}`:''}</td>

function addLeadToBoard(id){const l=state.leads[id];if(!l)return;
  const note=[`Lead signal (${SIG[l.signalType]||'lead'}${l.sourceDate?', '+l.sourceDate:''}): ${l.signal}`,l.whyFit?'Why it fits: '+l.whyFit:'',l.angle?'Angle: '+l.angle:'',l.contactName?'Person to reach: '+l.contactName:''].filter(Boolean).join('\n');

  l.status='added';l.jobId=j.id;persistLead(id);return j}
async function scanGmail(){
  if(!mcp||!sample)return;state.scanBusy=true;state.leadScan='Searching Gmail for job alerts and recruiter emails…';render();
  try{
    const q='(subject:(job OR jobs OR role OR opportunity OR hiring OR position OR recruiter) OR from:(linkedin.com OR indeed.com OR ziprecruiter.com OR glassdoor.com OR builtin.com OR dice.com)) newer_than:7d -category:promotions';
    const r=await mcp.callTool('Gmail','search_threads',{query:q,pageSize:40},{cache:false});
    const threads=(r.payload&&Array.isArray(r.payload.threads))?r.payload.threads:[];
    if(!threads.length){state.leadScan='No job emails in the last 7 days.';return}

    const p=state.profile;
    const known=new Set([...Object.values(state.leads).map(l=>leadKey(l.company,l.role)),...Object.values(state.jobs).map(j=>leadKey(j.company,j.role))]);
    const out=await sample.json(`You screen job emails for a candidate. Candidate: ${p.headline}\nTargets: ${p.targets}${p.scanFocus?'\nIndustries and signals they care about: '+p.scanFocus:''}\n\nFrom the emails below, pick specific job opportunities (a named company and role) that plausibly fit the candidate. Skip newsletters, generic marketing, spam and roles far from the targets. Reply with only a JSON array (possibly empty) of objects: {"i": email index, "company": "", "role": "", "location": "", "score": 0-100 fit, "whyFit": one sentence, "angle": one sentence on how to approach}.\n\nEMAILS:\n${items.map(x=>`[${x.i}] ${x.date} | ${x.from} | ${x.subject} | ${x.snippet}`).join('\n')}`,{cache:false});
    const arr=Array.isArray(out)?out:[];let added=0;
    for(const o of arr.slice(0,15)){const it=items[Number(o.i)];if(!it||!o.company||!o.role)continue;const k=leadKey(o.company,o.role);if(known.has(k))continue;known.add(k);
      const id=uid('lg');state.leads[id]={id,company:String(o.company),role:String(o.role),location:String(o.location||''),signalType:'email',signal:`Email: "${it.subject}" from ${it.from}`,whyFit:String(o.whyFit||''),angle:String(o.angle||''),contactName:'',score:Math.max(0,Math.min(100,Math.round(Number(o.score)||0))),url:it.url,sourceDate:it.date,foundAt:Date.now(),status:'new',origin:'gmail'};persistLead(id);added++}
    state.leadScan=added?`Added ${added} lead${added>1?'s':''} from Gmail.`:'No new fitting roles found in recent job emails.';state.leadTab='new'}
  catch(e){state.leadScan=e&&e.code&&gmailErr(e)&&['server_not_connected','needs_reauth','not_in_manifest','blocked_by_policy','selection_required','server_unavailable','tool_error'].includes(e.code)?gmailErr(e):sampleErr(e&&e.code)}

      execute:({job_id,kind,text})=>{const j=need(job_id);if(!['resume','cover'].includes(kind))throw new Error('kind must be resume or cover');saveDoc(j,kind,String(text));after();return 'ok'}}

async function ask(q){
  q=String(q||'').trim();if(!q||chatBusy)return;
  if(!sample){toast('Claude is not available in this view.');return}
  const j=curJob();if(j&&!j.chat)j.chat=[];
  const list=j?j.chat:state.globalChat;
  list.push({role:'user',content:q,at:Date.now()});
  const m={role:'assistant',content:'',at:Date.now(),pending:true};list.push(m);
  state.chatOpen=true;chatBusy=true;renderAssistant();
  chatCtl=new AbortController();
  const history=list.filter(x=>x!==m&&x.content&&!x.error).slice(-14).map(x=>({role:x.role,content:x.content}));
  while(history.length&&history[0].role!=='user')history.shift();
  const turns=[{role:'user',content:contextText(j)},...history];
  const opts={signal:chatCtl.signal,cache:false,onText:({text})=>{m.content=text;const el=document.querySelector(`#as-msgs .msg[data-i="${list.indexOf(m)}"]`);if(el){el.innerHTML=mdToHtml(text);const b=$('#as-msgs');b.scrollTop=b.scrollHeight}}};
  if(toolsOK)opts.tools=makeTools();
  try{const r=await sample(turns,opts);m.content=r.text;if(r.truncated)m.error='The answer was cut short. Ask for less at a time.'}
  catch(e){if(e.code==='refused'){m.content='';m.error='Claude declined that request. Try rephrasing it.'}else{m.content=e.text||'';if(e.code!=='cancelled')m.error=sampleErr(e.code)}}
  finally{delete m.pending;chatBusy=false;if(!m.content&&!m.error)list.splice(list.indexOf(m),1);persistChat(j);renderAssistant();if(toolsOK)safeRender()}
}

async function extractText(file){
  const name=file.name.toLowerCase();
  if(/\.(txt|md)$/.test(name)||file.type.startsWith('text/'))return await file.text();
  if(/\.docx$/.test(name)){
    if(!window.mammoth)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return r.value}
  if(/\.pdf$/.test(name)||file.type==='application/pdf'){
    if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')}
    const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
    let out=[];for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();let line='';const lines=[];let lastY=null;
      for(const it of tc.items){const y=it.transform?.[5];if(lastY!==null&&y!==undefined&&Math.abs(y-lastY)>2&&line){lines.push(line);line=''}line+=(line&&!/\s$/.test(line)&&it.str&&!/^\s/.test(it.str)&&lastY!==null&&Math.abs((y??lastY)-lastY)<=2?' ':'')+it.str;if(it.hasEOL){lines.push(line);line=''}if(y!==undefined)lastY=y}
      if(line)lines.push(line);out.push(lines.map(l=>l.replace(/\s{2,}/g,' ').trim()).join('\n'))}
    return out.join('\n\n')}
  if(/\.doc$/.test(name))throw new Error('Older .doc files can\'t be read here. Save it as .docx or PDF and try again.');
  throw new Error('That file type isn\'t supported. Use a PDF, .docx or text file.')}
async function handleResumeFile(file){

function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function importCalls(text){
  const j=curJob();const digits=s=>String(s||'').replace(/\D/g,'').slice(-10);
  const target=digits(j.contact?.phone);
  if(!target){state.callImport={error:'Add the contact\'s phone number on the Overview tab first, so calls can be matched.'};render();return}
  const rows=parseCSV(text);if(rows.length<2){state.callImport={error:'That file has no rows.'};render();return}
  const H=rows[0].map(h=>h.toLowerCase());const col=re=>H.findIndex(h=>re.test(h));
  const ci={date:col(/date|time|start/),num:col(/number|phone|caller|to|from/),name:col(/name|contact/),dur:col(/duration|length|minutes/),type:col(/type|direction|call type/)};
  if(ci.num<0){state.callImport={error:'Could not find a phone number column in that file.'};render();return}
  const matches=rows.slice(1).filter(r=>digits(r[ci.num])===target).map(r=>{const d=parseDate(r[ci.date]);const typ=String(r[ci.type]||'').toLowerCase();
    return{type:'call',date:d?new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10):todayISO(),who:(ci.name>=0&&r[ci.name])||j.contact?.name||r[ci.num],duration:ci.dur>=0?r[ci.dur]:'',dir:/out|dial/.test(typ)?'out':/in|received/.test(typ)?'in':'',subject:/miss/.test(typ)?'Missed call':'Phone call',body:'',callKey:r[ci.num]+'|'+r[ci.date]}});
  const have=new Set((j.comms||[]).map(c=>c.callKey).filter(Boolean));
  state.callImport={rows:matches.filter(m=>!have.has(m.callKey)),total:rows.length-1};render()}

    <div class="field" style="margin-bottom:10px"><label for="np-name">Profile name</label><input class="input" id="np-name" name="name" required placeholder="e.g. Sam Rivera, or Sales roles"></div>
    <label class="check-row"><input type="checkbox" name="copy" ${state.profile.baseResume?'':'disabled'}> <span>Start with a copy of this profile's base resume and settings</span></label>
    <div class="modal-foot"><button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn primary">Create profile</button></div></form></div>`;
  $('#np-name').focus()}
async function createProfile(name,copy){
  const id=uid('pr');const now=Date.now();const src=copy?clone(state.profile):null;
  try{await db.doc('profiles/'+id).set({name,createdAt:now})}catch(e){toast(dbErr(e));return}
  if(PID==='main'&&!state.profiles?.main){db.doc('profiles/main').set({name:state.profile.name||'Main profile',createdAt:0}).catch(()=>{})}
  switchProfile(id);
  const prof={...PROFILE_DEFAULT,...(src?{headline:src.headline,targets:src.targets,baseResume:src.baseResume,scanFocus:src.scanFocus||'',playbook:src.playbook||[],playbookName:src.playbookName||'',playbookIntro:src.playbookIntro||'',compCols:src.compCols||3,pdfStyle:src.pdfStyle||'classic'}:{}),name};
  state.profile=prof;persistProfile();state.view='profile';render();toast(`Profile "${name}" created`)}
async function deleteProfile(){
  if(PID==='main'||!db)return;const id=PID;const pre='p/'+id+'/';
  try{for(const col of ['jobs','leads']){const snap=await db.collection(pre+col).get();for(const d of snap.docs)await db.doc(pre+col+'/'+d.id).delete()}
    for(const d of ['settings/profile','settings/scan','chats/global'])await db.doc(pre+d).delete();
    await db.doc('profiles/'+id).delete()}catch(e){toast(dbErr(e))}
  switchProfile('main');toast('Profile deleted')}
function syncProfileName(){const name=state.profile.name||'';const rec=state.profiles?.[PID]||{createdAt:PID==='main'?0:Date.now()};queueWrite('pname',()=>db.doc('profiles/'+PID).set({...rec,name}),900)}

/* ---------- boot ---------- */
{const h=location.hash.slice(1);if(['dashboard','board','leads','jobs','profile'].includes(h))state.view=h}
render();
(async()=>{
  const c=window.claude;
  if(c&&typeof c.use==='function'){[db,sample,mcp,downloads]=await Promise.all(['db','sample','mcp','downloads'].map(n=>c.use(n).catch(()=>null)))}
  if(!db){db=localDB();sample=apiSample();downloads=localDownloads();mcp=null;state.standalone=true;startRelabel()}
  if(sample&&!state.standalone){try{const l=await sample.limits();toolsOK=!!l.tools}catch{toolsOK=false}}
  unsubs.push(db.collection('profiles').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=clone(d.data()));state.profiles=m;
    if(PID!=='main'&&!m[PID]&&snap.metadata&&!snap.metadata.fromCache){switchProfile('main');return}renderProfileSelect()},()=>{}));
  subscribeProfile();
  render();
})();
</script>
